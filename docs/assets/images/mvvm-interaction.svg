<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="500"
     viewBox="0 0 1200 500"
     role="img"
     aria-labelledby="title description">
    <title id="title">MVVM interaction request sequence</title>
    <desc id="description">
        The view invokes a delete command on the view model. The view model requests confirmation from the view.
        The view presents an alert and completes the request with the user's response. If confirmed, the view model
        invokes the delete operation on the model.
    </desc>

    <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#182230" flood-opacity="0.14"/>
        </filter>

        <marker id="arrow-command"
                viewBox="0 0 10 10"
                refX="9"
                refY="5"
                markerWidth="8"
                markerHeight="8"
                orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f67b2"/>
        </marker>

        <marker id="arrow-request"
                viewBox="0 0 10 10"
                refX="9"
                refY="5"
                markerWidth="8"
                markerHeight="8"
                orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c45f1a"/>
        </marker>

        <marker id="arrow-response"
                viewBox="0 0 10 10"
                refX="9"
                refY="5"
                markerWidth="8"
                markerHeight="8"
                orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#278064"/>
        </marker>

        <style>
            .diagram-text {
                fill: #182230;
                font-family: Inter, "Segoe UI", Arial, sans-serif;
            }

            .box-title {
                font-size: 25px;
                font-weight: 650;
                text-anchor: middle;
            }

            .step-label {
                font-size: 19px;
                font-weight: 600;
                text-anchor: middle;
            }

            .note-label {
                font-size: 19px;
                font-weight: 550;
                text-anchor: middle;
            }

            .lifeline {
                fill: none;
                stroke: #b9c4d2;
                stroke-dasharray: 7 7;
                stroke-width: 2;
            }

            .command {
                fill: none;
                stroke: #2f67b2;
                stroke-linecap: round;
                stroke-width: 3;
                marker-end: url(#arrow-command);
            }

            .request {
                fill: none;
                stroke: #c45f1a;
                stroke-dasharray: 8 7;
                stroke-linecap: round;
                stroke-width: 3;
                marker-end: url(#arrow-request);
            }

            .response {
                fill: none;
                stroke: #278064;
                stroke-linecap: round;
                stroke-width: 3;
                marker-end: url(#arrow-response);
            }
        </style>
    </defs>

    <rect x="1" y="1" width="1198" height="498" rx="18" fill="#ffffff" stroke="#d9e0ea" stroke-width="2"/>

    <g filter="url(#shadow)">
        <rect x="80" y="38" width="240" height="72" rx="14" fill="#eaf2ff" stroke="#5c7fae" stroke-width="2"/>
        <rect x="480" y="38" width="240" height="72" rx="14" fill="#f0ecff" stroke="#7565ad" stroke-width="2"/>
        <rect x="880" y="38" width="240" height="72" rx="14" fill="#ecf8f1" stroke="#568a6d" stroke-width="2"/>
    </g>

    <text class="diagram-text box-title" x="200" y="83">View</text>
    <text class="diagram-text box-title" x="600" y="83">ViewModel</text>
    <text class="diagram-text box-title" x="1000" y="83">Model</text>

    <path class="lifeline" d="M 200 110 V 452"/>
    <path class="lifeline" d="M 600 110 V 452"/>
    <path class="lifeline" d="M 1000 110 V 452"/>

    <path class="command" d="M 220 165 H 580"/>
    <text class="diagram-text step-label" x="400" y="153" fill="#254f86">1 · deleteCommand(path)</text>

    <path class="request" d="M 580 245 H 220"/>
    <text class="diagram-text step-label" x="400" y="223" fill="#9d4811">2 · confirmDelete.requestAndWait(path)</text>

    <g filter="url(#shadow)">
        <rect x="82" y="275" width="236" height="58" rx="12" fill="#fff7ef" stroke="#d98a50" stroke-width="2"/>
    </g>
    <text class="diagram-text note-label" x="200" y="310" fill="#804017">View presents an Alert</text>

    <path class="response" d="M 220 375 H 580"/>
    <text class="diagram-text step-label" x="400" y="363" fill="#1f654f">3 · request.complete(confirmed)</text>

    <path class="command" d="M 620 415 H 980"/>
    <text class="diagram-text step-label" x="800" y="403" fill="#254f86">4 · delete(path), if confirmed</text>

    <text class="diagram-text note-label" x="600" y="474" fill="#556273">
        The interaction carries data; the view chooses how to present it.
    </text>
</svg>
